name: Generate Vocab Images

on:
  schedule:
    # Runs every 4 hours (at minute 15: 00:15, 04:15, 08:15, 12:15, 16:15, 20:15 UTC)
    - cron: '15 */4 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of images to generate in this run'
        required: false
        default: '8'
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Vocabulary Images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '8' }}
        run: |
          node scripts/generate-vocab-images.cjs

      - name: Commit and push generated images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images/vocab/
          if git diff --staged --quiet; then
            echo "No new images were generated or committed."
          else
            git commit -m "chore(vocab): auto-generate vocab images batch [skip ci]"
            git push origin main
          fi
